linters:
  enable:
    - gosec
    - gocritic
    - staticcheck

issues:
  exclude-rules:
    - linters: [gosec]
      text: "G304:"  # file path via variable — valid in codegen (generate.go, proto_generate.go)
    - linters: [gosec]
      text: "G115:"  # integer conversion overflow — false positive on iota enum patterns
