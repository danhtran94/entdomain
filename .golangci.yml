version: "2"

linters:
  enable:
    - gosec
    - gocritic
    - staticcheck

issues:
  exclude-rules:
    - linters: [gosec]
      text: "Potential file inclusion via variable"  # G304: inherent to all codegen file processing
    - linters: [gosec]
      text: "integer overflow conversion"  # G115: false positive on iota-based enum constants
    - linters: [gosec]
      text: "Expect WriteFile permissions to be 0600 or less"  # G306: generated source files must be world-readable (0644)
    - linters: [gosec]
      text: "Expect directory permissions to be 0750 or less"  # G301: codegen output dirs need group/world-execute for tools
    - linters: [gocritic]
      text: "ifElseChain"  # nil-checks and boolean guards in type dispatchers cannot be expressed as switch
